    // Helper: clean markdown formatting from backend AI
    function cleanMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/```[a-zA-Z]*\n?/g, '')
        .replace(/```/g, '')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/`/g, '')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/^>\s+/gm, '')
        .replace(/^(\s*)\*\s+/gm, '$1• ')
        .replace(/\*\*/g, '')
        .replace(/__/g, '')
        .replace(/\*/g, '')
        .replace(/~~/g, '')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '$1 ($2)')
        .replace(/^[-=_]{3,}\s*$/gm, '')
        .trim();
    }

                          <label className="block text-xs font-bold text-stone-700 mb-1">{t.contact.phoneLabel}</label>
                          <input
                            type="tel"
                            value={formData.phone}
                            onChange={(e) => setFormData({ ...formData, phone: e.target.value })}
                            placeholder="e.g. 08123456789"
                            className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                            required
                          />
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-stone-700 mb-1">{t.contact.messageLabel}</label>
                          <textarea
                            rows="3"
                            value={formData.message}
                            onChange={(e) => setFormData({ ...formData, message: e.target.value })}
                            placeholder="Tuliskan pertanyaan atau rencana kunjungan Anda..."
                            className="w-full bg-stone-50 border border-stone-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:border-emerald-500"
                            required
                          ></textarea>
                        </div>

                        <button
                          type="submit"
                          className="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition-colors text-sm flex items-center justify-center space-x-2 cursor-pointer shadow-sm"
                        >
                          <MessageCircle className="w-4 h-4" />
                          <span>{t.contact.sendBtn}</span>
                        </button>
                      </form>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* ======================================================== */}
          {/* FLOATING CHATBOT WIDGET (LAUNCHER & MODAL DRAWER)        */}
          {/* ======================================================== */}

          {/* Launcher Button (Always visible at bottom-right) */}
          <div className="fixed bottom-6 right-6 z-50 flex items-center space-x-2">
            <button
              onClick={() => setAssistantOpen(!assistantOpen)}
              className="group bg-gradient-to-r from-emerald-700 to-teal-800 hover:from-emerald-800 hover:to-teal-900 text-white p-3.5 sm:px-4 sm:py-3.5 rounded-full shadow-2xl transition-all hover:scale-105 flex items-center space-x-2.5 cursor-pointer border-2 border-emerald-300 pulse-glow"
              aria-label="Buka Emerald AI Assistant"
            >
              <div className="relative">
                <Bot className="w-6 h-6 text-emerald-200" />
                <span className="absolute -top-1 -right-1 w-2.5 h-2.5 bg-emerald-400 rounded-full border-2 border-emerald-900"></span>
              </div>
              <span className="hidden sm:inline font-bold text-xs tracking-wide">Emerald AI</span>
            </button>
          </div>

          {/* Chatbot Window / Drawer */}
          {assistantOpen && (
            <div className="fixed bottom-24 right-4 sm:right-6 z-50 w-[calc(100vw-2rem)] sm:w-[410px] bg-white rounded-3xl shadow-2xl border border-stone-200 flex flex-col h-[530px] max-h-[85vh] overflow-hidden animate-in slide-in-from-bottom duration-300">
              {/* Header */}
              <div className="bg-gradient-to-r from-emerald-950 via-emerald-900 to-teal-950 text-white px-4 py-3.5 flex items-center justify-between border-b border-emerald-800/40">
                <div className="flex items-center space-x-2.5">
                  <div className="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-teal-700 flex items-center justify-center shadow-md relative flex-shrink-0">
                    <Sparkles className="w-4 h-4 text-white" />
                    <span className="absolute -bottom-0.5 -right-0.5 w-2.5 h-2.5 bg-emerald-400 rounded-full border-2 border-emerald-950"></span>
                  </div>
                  <div>
                    <h3 className="font-extrabold text-sm leading-tight text-white">{t.assistant.title}</h3>
                    <p className="text-[10.5px] text-emerald-300 font-medium flex items-center space-x-1">
                      <span className="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                      <span>{t.assistant.subtitle}</span>
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-1">
                  {/* Clear Chat Button */}
                  <button
                    onClick={handleClearChat}
                    className="text-emerald-300 hover:text-white p-1.5 rounded-lg hover:bg-emerald-800/50 transition-colors cursor-pointer"
                    title={lang === 'id' ? 'Bersihkan Riwayat Chat' : 'Clear Chat History'}
                  >
                    <Trash2 className="w-4 h-4" />
                  </button>
                  {/* Close Button */}
                  <button
                    onClick={() => setAssistantOpen(false)}
                    className="text-emerald-300 hover:text-white p-1.5 rounded-lg hover:bg-emerald-800/50 transition-colors cursor-pointer"
                    title="Tutup Widget"
                  >
                    <X className="w-5 h-5" />
                  </button>
                </div>
              </div>

              {/* Quick Chips (Horizontal Scrollable) */}
              <div className="bg-stone-50/90 px-3 py-2 border-b border-stone-200/80 flex items-center space-x-1.5 overflow-x-auto custom-scrollbar flex-shrink-0 text-[11px]">
                {quickSuggestions.map((item, idx) => (
                  <button
                    key={idx}
                    onClick={() => sendMessage(item.query)}
                    className="whitespace-nowrap bg-white hover:bg-emerald-700 hover:text-white text-emerald-800 font-semibold px-2.5 py-1 rounded-full border border-emerald-200 transition-all cursor-pointer shadow-2xs hover:scale-102"
                  >
                    {item.label}
                  </button>
                ))}
              </div>

              {/* Chat Messages Body */}
              <div className="flex-1 p-4 overflow-y-auto space-y-3 bg-stone-50/50 text-xs custom-scrollbar">
                {messages.map((m, i) => (
                  <div
                    key={i}
                    className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}
                  >
                    <div
                      className={`max-w-[85%] p-3.5 rounded-2xl ${
                        m.sender === 'user'
                          ? 'bg-gradient-to-br from-emerald-600 to-emerald-700 text-white rounded-br-xs shadow-sm font-medium'
                          : m.sender.includes('error')
                          ? 'bg-rose-50 text-rose-950 border border-rose-200 rounded-bl-xs shadow-2xs'
                          : 'bg-white text-stone-900 border border-stone-200/90 rounded-bl-xs shadow-2xs'
                      }`}
                    >
                      <p className="leading-relaxed whitespace-pre-line text-[12.5px]">{m.text}</p>
                    </div>
                    {m.time && (
                      <span className="text-[9.5px] text-stone-400 mt-1 px-1">{m.time}</span>
                    )}
                  </div>
                ))}

                {isLoadingAi && (
                  <div className="flex flex-col items-start">
                    <div className="bg-white p-3 rounded-2xl border border-stone-200 flex items-center space-x-2 text-stone-500 shadow-2xs">
                      <Loader2 className="w-4 h-4 animate-spin text-emerald-600" />
                      <span className="text-xs font-semibold text-emerald-800">
                        {lang === 'id' ? 'Emerald AI sedang mengetik...' : 'Emerald AI is typing...'}
                      </span>
                    </div>
                  </div>
                )}
                <div ref={chatBottomRef} />
              </div>

              {/* Chat Disclaimer Banner */}
              <div className="px-3 py-1.5 bg-amber-50/90 text-[10px] text-amber-900 border-t border-amber-200/60 flex items-center space-x-1.5 flex-shrink-0">
                <Info className="w-3.5 h-3.5 text-amber-600 flex-shrink-0" />
                <span className="truncate">{t.assistant.disclaimer}</span>
              </div>

              {/* Chat Input Form */}
              <form onSubmit={handleSendMessage} className="p-2.5 bg-white border-t border-stone-200 flex items-center space-x-2 flex-shrink-0">
                <input
                  type="text"
                  value={inputMsg}
                  onChange={(e) => setInputMsg(e.target.value)}
                  placeholder={t.assistant.placeholder}
                  disabled={isLoadingAi}
                  className="flex-1 bg-stone-100 hover:bg-stone-50 focus:bg-white border border-stone-200 rounded-xl px-3 py-2 text-xs text-stone-800 placeholder-stone-400 focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-all font-medium"
                />
                <button
                  type="submit"
                  disabled={isLoadingAi || !inputMsg.trim()}
                  className="bg-emerald-600 hover:bg-emerald-700 disabled:opacity-40 text-white p-2.5 rounded-xl transition-all cursor-pointer shadow-sm hover:scale-105 active:scale-95"
                  title="Kirim Pesan"
                >
                  <Send className="w-4 h-4" />
                </button>
              </form>
            </div>
          )}

          {/* ==================== FOOTER ==================== */}
          <footer className="bg-stone-900 text-stone-300 py-12 border-t border-stone-800 text-xs sm:text-sm">
            <div className="container mx-auto px-4">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div className="space-y-3 md:col-span-1">
                  <div className="flex items-center space-x-2 text-white">
                    <Sparkles className="w-5 h-5 text-emerald-400" />
                    <span className="font-bold text-base">Emerald Fit Club</span>
                  </div>
                  <p className="text-stone-400 text-xs leading-relaxed">{t.footer.aboutText}</p>
                </div>

                <div>
                  <h4 className="font-bold text-white text-sm mb-3">{t.footer.quickLinks}</h4>
                  <ul className="space-y-2 text-xs">
                    {['home', 'about', 'services', 'calculator', 'blog', 'contact'].map((tab) => (
                      <li key={tab}>
                        <button
                          onClick={() => setActiveTab(tab)}
                          className="hover:text-emerald-400 transition-colors capitalize cursor-pointer text-stone-400 hover:underline"
                        >
                          {t.nav[tab]}
                        </button>
                      </li>
                    ))}
                  </ul>
                </div>

                <div>
                  <h4 className="font-bold text-white text-sm mb-3">{t.footer.services}</h4>
                  <ul className="space-y-2 text-xs text-stone-400">
                    <li>Konsultasi Gaya Hidup Sehat</li>
                    <li>Edukasi Nutrisi & Pola Makan</li>
                    <li>Analisa Tanita (Lemak & Otot)</li>
                    <li>Panduan Kebiasaan Sehat</li>
                  </ul>
                </div>

                <div>
                  <h4 className="font-bold text-white text-sm mb-3">{t.footer.contactInfo}</h4>
                  <p className="text-stone-400 text-xs leading-relaxed mb-2">
                    Jl. Danau Tondano Dalam, Sawojajar 1, Malang, Jawa Timur 65139
                  </p>
                  <p className="text-emerald-400 font-semibold text-xs mb-2">0813-3650-3618 (Coach Niar)</p>
                  <p className="text-stone-400 text-xs">{t.contact.hoursText.split('\n')[0]}</p>
                </div>
              </div>

              <div className="pt-8 border-t border-stone-800 text-center text-stone-500 text-xs">
                <p>© 2026 {t.footer.rights}</p>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    // Render the App
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>

</html>
